# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} / R-${{ matrix.config.r }} / ${{ matrix.config.compiler }}

    continue-on-error: ${{ matrix.config.experimental }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: macos-latest,  r: 'release', compiler: 'clang', experimental: false }
          - { os: macos-latest,  r: 'devel',   compiler: 'clang', experimental: true }

          - { os: ubuntu-latest, r: 'release', compiler: 'gcc',   experimental: false }
          - { os: ubuntu-latest, r: 'devel',   compiler: 'gcc',   experimental: false, http-user-agent: 'release' }
          - { os: ubuntu-latest, r: 'release', compiler: 'clang', experimental: false }
          - { os: ubuntu-latest, r: 'devel',   compiler: 'clang', experimental: false, http-user-agent: 'release' }

          - {
              os: windows-latest,
              r: 'release',
              compiler: 'gcc',
              experimental: true,
              msystem: 'UCRT64',
              prefix: 'ucrt64',
              c_compiler: 'gcc.exe',
              cxx_compiler: 'g++.exe',
              fc_compiler: 'gfortran.exe',
              toolchain_pkg: 'mingw-w64-ucrt-x86_64-toolchain',
              mimalloc_pkg: 'mingw-w64-ucrt-x86_64-mimalloc'
            }
          - {
              os: windows-latest,
              r: 'devel',
              compiler: 'gcc',
              experimental: true,
              msystem: 'UCRT64',
              prefix: 'ucrt64',
              c_compiler: 'gcc.exe',
              cxx_compiler: 'g++.exe',
              fc_compiler: 'gfortran.exe',
              toolchain_pkg: 'mingw-w64-ucrt-x86_64-toolchain',
              mimalloc_pkg: 'mingw-w64-ucrt-x86_64-mimalloc'
            }
          - {
              os: windows-latest,
              r: 'release',
              compiler: 'clang',
              experimental: true,
              msystem: 'CLANG64',
              prefix: 'clang64',
              c_compiler: 'clang.exe',
              cxx_compiler: 'clang++.exe',
              fc_compiler: 'gfortran.exe',
              toolchain_pkg: 'mingw-w64-clang-x86_64-toolchain',
              mimalloc_pkg: 'mingw-w64-clang-x86_64-mimalloc'
            }
          - {
              os: windows-latest,
              r: 'devel',
              compiler: 'clang',
              experimental: true,
              msystem: 'CLANG64',
              prefix: 'clang64',
              c_compiler: 'clang.exe',
              cxx_compiler: 'clang++.exe',
              fc_compiler: 'gfortran.exe',
              toolchain_pkg: 'mingw-w64-clang-x86_64-toolchain',
              mimalloc_pkg: 'mingw-w64-clang-x86_64-mimalloc'
            }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
          update-rtools: true
          Ncpus: '4'
      
      # --------------------------------------------------------------------
      # Linux compiler setup
      # --------------------------------------------------------------------

      - name: Install GCC on Linux
        if: runner.os == 'Linux' && matrix.config.compiler == 'gcc'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y gcc g++ gfortran libmimalloc-dev

      - name: Configure R to use GCC on Linux
        if: runner.os == 'Linux' && matrix.config.compiler == 'gcc'
        shell: bash
        run: |
          mkdir -p ~/.R
          cat > ~/.R/Makevars <<'EOF'
          CC=gcc
          CXX=g++
          CXX11=g++
          CXX14=g++
          CXX17=g++
          CXX20=g++
          FC=gfortran
          F77=gfortran
          EOF

      - name: Install Clang with OpenMP support on Linux
        if: runner.os == 'Linux' && matrix.config.compiler == 'clang'
        shell: bash
        run: |
          set -euo pipefail
          source /etc/os-release
          sudo apt-get update
          sudo apt-get install -y gfortran wget gpg
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/${UBUNTU_CODENAME}/ llvm-toolchain-${UBUNTU_CODENAME}-23 main" | \
            sudo tee /etc/apt/sources.list.d/llvm.list > /dev/null
          sudo apt-get update
          sudo apt-get upgrade -y
          sudo apt-get install -y clang-23 libomp-23-dev libmimalloc-dev

      - name: Configure R to use Clang with OpenMP on Linux
        if: runner.os == 'Linux' && matrix.config.compiler == 'clang'
        shell: bash
        run: |
          mkdir -p ~/.R

          cat > ~/.R/Makevars <<'EOF'
          CC=clang-23
          CXX=clang++-23
          CXX11=clang++-23
          CXX14=clang++-23
          CXX17=clang++-23
          CXX20=clang++-23

          FC=gfortran
          F77=gfortran

          SHLIB_OPENMP_CFLAGS=-fopenmp
          SHLIB_OPENMP_CXXFLAGS=-fopenmp
          SHLIB_OPENMP_FFLAGS=-fopenmp
          SHLIB_OPENMP_FCFLAGS=-fopenmp
          EOF

      # --------------------------------------------------------------------
      # macOS compiler setup
      # --------------------------------------------------------------------
      - name: Install and configure Clang on macOS
        if: runner.os == 'macOS' && matrix.config.compiler == 'clang'
        shell: bash
        run: |
          brew update
          brew install llvm libomp mimalloc

          LLVM_PREFIX="$(brew --prefix llvm)"
          BREW_PREFIX="$(brew --prefix)"
          MIMALLOC_PREFIX="$(brew --prefix mimalloc)"

          echo "${LLVM_PREFIX}/bin" >> "${GITHUB_PATH}"

          mkdir -p ~/.R
          cat > ~/.R/Makevars <<EOF
          CC=${LLVM_PREFIX}/bin/clang
          CXX=${LLVM_PREFIX}/bin/clang++
          CXX11=${LLVM_PREFIX}/bin/clang++
          CXX14=${LLVM_PREFIX}/bin/clang++
          CXX17=${LLVM_PREFIX}/bin/clang++
          CXX20=${LLVM_PREFIX}/bin/clang++
          CPPFLAGS=-I${LLVM_PREFIX}/include -I${BREW_PREFIX}/include -I${MIMALLOC_PREFIX}/include
          LDFLAGS=-L${LLVM_PREFIX}/lib -L${BREW_PREFIX}/lib -L${MIMALLOC_PREFIX}/lib
          
      # --------------------------------------------------------------------
      # Windows compiler setup
      # --------------------------------------------------------------------

      - name: Setup MSYS2 toolchain on Windows
        id: msys2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.config.msystem }}
          update: true
          install: >-
            ${{ matrix.config.toolchain_pkg }}
            ${{ matrix.config.mimalloc_pkg }}

      - name: Configure R on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
          MSYS2_PREFIX: ${{ matrix.config.prefix }}
          CC_NAME: ${{ matrix.config.c_compiler }}
          CXX_NAME: ${{ matrix.config.cxx_compiler }}
          FC_NAME: ${{ matrix.config.fc_compiler }}
        run: |
          mkdir -p ~/.R

          cat > ~/.R/Makevars.ucrt <<EOF
          CC=${MSYS2_ROOT}/${MSYS2_PREFIX}/bin/${CC_NAME}
          CXX=${MSYS2_ROOT}/${MSYS2_PREFIX}/bin/${CXX_NAME}
          CXX11=${MSYS2_ROOT}/${MSYS2_PREFIX}/bin/${CXX_NAME}
          CXX14=${MSYS2_ROOT}/${MSYS2_PREFIX}/bin/${CXX_NAME}
          CXX17=${MSYS2_ROOT}/${MSYS2_PREFIX}/bin/${CXX_NAME}
          CXX20=${MSYS2_ROOT}/${MSYS2_PREFIX}/bin/${CXX_NAME}
          FC=${MSYS2_ROOT}/${MSYS2_PREFIX}/bin/${FC_NAME}
          F77=${MSYS2_ROOT}/${MSYS2_PREFIX}/bin/${FC_NAME}
          PKG_CFLAGS+=-I${MSYS2_ROOT}/${MSYS2_PREFIX}/include
          CPPFLAGS+= -I${MSYS2_ROOT}/${MSYS2_PREFIX}/include
          LDFLAGS+= -L${MSYS2_ROOT}/${MSYS2_PREFIX}/lib
          EOF

          export C_INCLUDE_PATH="${C_INCLUDE_PATH};${MSYS2_ROOT}/${MSYS2_PREFIX}/include"
          export CPLUS_INCLUDE_PATH="${CPLUS_INCLUDE_PATH};${MSYS2_ROOT}/${MSYS2_PREFIX}/include"
          export LIBRARY_PATH="${LIBRARY_PATH};${MSYS2_ROOT}/${MSYS2_PREFIX}/lib"
      - name: Show selected compiler configuration
        shell: bash
        run: |
          echo "Runner OS: $RUNNER_OS"
          echo "Requested compiler: ${{ matrix.config.compiler }}"
          echo

          if [ "$RUNNER_OS" = "Windows" ]; then
            if [ -f "$HOME/.R/Makevars.ucrt" ]; then
              cat "$HOME/.R/Makevars.ucrt"
            fi

            where.exe clang64 || true
            where.exe clang++64 || true
            where.exe llvm-ar || true
          else
            if [ -f "$HOME/.R/Makevars" ]; then
              cat "$HOME/.R/Makevars"
            fi
          fi

          echo
          echo "Compiler versions:"
          gcc --version || true
          g++ --version || true
          clang --version || true
          clang++ --version || true
          gfortran --version || true

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          Rscript -e 'install.packages(c("rcmdcheck", "dplyr", "purrr", "tidyr", "knitr", "rmarkdown", "cellWise"), type = "both", Ncpus =  4L)'
      - name: Install dependencies (non-macOS)
        if: runner.os != 'macOS'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          dependencies: '"hard"'
        
      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-results: true
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
